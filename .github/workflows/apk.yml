# Builds the Android install file and puts it on the Releases page:
# https://github.com/shipwreckbay123/pbt-shifts/releases/latest/download/pbt-shifts.apk
# The APK opens the hosted app, so normal app changes don't need a new APK.
name: Build Android app
on:
  push:
    branches: [main]
    paths:
      - "android-shell/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - name: Check the signing key is set up
        id: key
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret yet, so no APK was built. Add the two secrets in Settings > Secrets and variables > Actions, then run this again."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        if: steps.key.outputs.ok == 'true'
        run: npm ci
      - name: Create the Android project
        if: steps.key.outputs.ok == 'true'
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0c1a40' --iconBackgroundColorDark '#0a1a29' \
            --splashBackgroundColor '#0c1a40' --splashBackgroundColorDark '#0a1a29'
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: Build
        if: steps.key.outputs.ok == 'true'
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Sign
        if: steps.key.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.jks" --ks-key-alias pbtshifts \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out pbt-shifts.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify pbt-shifts.apk
      - name: Publish to Releases
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" pbt-shifts.apk \
            --title "Android app 1.${{ github.run_number }}" \
            --notes "Download pbt-shifts.apk on your Android phone and open it to install." \
            --latest
